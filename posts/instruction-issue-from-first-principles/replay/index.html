<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue Replay · 最小原型</title>
  <script src="https://distill.pub/template.v2.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="status-board" aria-label="当前周期的硬件状态">
      <article class="hardware-overview">
        <div class="section-heading">
          <div>
            <p id="stage-label" class="panel-kicker"></p>
            <h2>硬件资源</h2>
          </div>
          <p id="mode-description" class="mode-description"></p>
        </div>

        <div class="hardware-groups">
          <div id="state-groups" class="state-groups" aria-label="依赖与寄存器状态"></div>
          <div>
            <p class="group-label">Execution units / global control</p>
            <div id="unit-bank" class="unit-bank" aria-label="执行单元和控制状态"></div>
          </div>
        </div>

        <div class="state-legend" aria-label="状态颜色图例">
          <span><i class="state-dot available"></i>可用</span>
          <span><i class="state-dot active"></i>使用中</span>
          <span><i class="state-ring checked"></i>当前指令读取</span>
        </div>
      </article>

      <article id="verdict-card" class="verdict-card">
        <p class="panel-kicker">THIS CYCLE</p>
        <div class="verdict-cycle">C<span id="cycle-number">0</span></div>
        <h2 id="verdict-title"></h2>
        <p id="verdict-reason"></p>
        <p id="check-summary" class="check-summary"></p>
      </article>
    </section>

    <section class="replay-figure" aria-label="指令流水回放">
      <div class="replay-heading">
        <div>
          <p class="panel-kicker">PIPELINE</p>
          <h2>Instruction × Cycle</h2>
        </div>
        <div class="legend" aria-label="流水阶段图例">
          <span><i class="legend-swatch issue"></i>Issue</span>
          <span><i class="legend-swatch execute"></i>Execute</span>
          <span><i class="legend-swatch writeback"></i>Write-back</span>
          <span><i class="legend-swatch blocked"></i>Blocked</span>
          <span><i class="legend-swatch nop"></i>NOP</span>
        </div>
      </div>

      <div class="pipeline-scroller">
        <div id="pipeline" class="pipeline"></div>
      </div>

      <div class="replay-controls">
        <button type="button" id="reset-button" class="control-button">重置</button>
        <button type="button" id="previous-button" class="control-button">上一周期</button>
        <button type="button" id="play-button" class="control-button">自动播放</button>
        <button type="button" id="next-button" class="control-button primary">下一周期</button>
      </div>

      <div class="slider-row">
        <span>0</span>
        <d-slider id="cycle-slider" min="0" max="6" value="0" step="1" ticks aria-label="选择周期"></d-slider>
        <span id="cycle-max">6</span>
      </div>
    </section>
  </main>
</body>
</html>
